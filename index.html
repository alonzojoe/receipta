<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Receipta — Send receipts, not screenshots</title>
    <meta
      name="description"
      content="Turn a GCash, Maya, or bank transfer into a clean receipt you can send in seconds. Free, no signup, and nothing leaves your device."
    />

    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#6c3aed" />

    <!--
      This block is what SHARE-CARD SCRAPERS see, and nothing else. Messenger, Viber and
      Facebook run no JavaScript, so the per-route tags the router writes never reach them.
      Every URL here is absolute for the same reason: a scraper has no page to resolve a
      relative path against, so `/logo_lockup.png` produced a card with no image at all.

      `seo.test.ts` pins these against page_meta['/'] so the shell and the home route
      cannot drift apart.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Receipta" />
    <meta property="og:url" content="https://receipta-app.netlify.app" />
    <meta property="og:title" content="Receipta — Send receipts, not screenshots" />
    <meta
      property="og:description"
      content="Turn a GCash, Maya, or bank transfer into a clean receipt you can send in seconds. Free, no signup, and nothing leaves your device."
    />
    <meta property="og:image" content="https://receipta-app.netlify.app/logo_lockup.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://receipta-app.netlify.app/logo_lockup.png" />
    <link rel="canonical" href="https://receipta-app.netlify.app" />
  </head>
  <body>
    <script>
      /*
       * Applies the theme before first paint.
       *
       * A React effect runs after the first paint, so without this a dark-mode user
       * sees a white flash on every load. This is inline and blocking on purpose: an
       * external file is not guaranteed to run before the page renders.
       *
       * The key is duplicated from src/shared/config/theme.ts because this script
       * cannot import from the bundle. A test asserts the two match.
       *
       * localStorage access throws outright in some privacy modes rather than
       * returning null, so the whole thing is wrapped and falls back to the device.
       */
      ;(function () {
        try {
          var stored = localStorage.getItem('receipta-theme')
          var theme = stored ? JSON.parse(stored) : 'system'
          var dark =
            theme === 'dark' ||
            (theme !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (error) {
          /* No stored preference available. The app resolves the theme on mount. */
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
